<div class="viewport"><div id="wrap"><div id="surface" class="blank"><img data-layer="S01-background" class="layer" alt="S01-background" draggable="false" src="layers/S01/assets/background.png" style="left:0px;top:0px;width:1672px;height:941px"><img data-layer="S01-floor-reflection" class="layer" alt="S01-floor-reflection" draggable="false" src="layers/S01/assets/floor-reflection.png" style="left:575.0656506447831px;top:570.172919109027px;width:1115.7045720984759px;height:361.60375146541617px"><img data-layer="S01-contact-shadow" class="layer" alt="S01-contact-shadow" draggable="false" src="layers/S01/assets/contact-shadow.png" style="left:590.7158338350391px;top:535.451836243227px;width:1127.7254665863936px;height:377.12221553281154px"><img data-layer="S01-device-terminal" class="layer" alt="S01-device-terminal" draggable="false" src="layers/S01/assets/device.png" style="left:466.3999999999999px;top:95.19999999999999px;width:1337.6000000000001px;height:752.0px"><img data-layer="S01-wordmark" class="layer" alt="S01-wordmark" draggable="false" src="layers/S01/assets/wordmark.png" style="left:25.397555715312734px;top:203.0841121495327px;width:491.43350107836085px;height:204.72178289000718px"><div data-layer="S01-descriptor" class="layer" style="left:101px;top:422px;width:459px;height:49px;font-family:&quot;Microsoft YaHei UI&quot;,sans-serif;font-size:54px;font-weight:400;color:#E9ECF2;text-align:left;line-height:1.1;letter-spacing:4px;white-space:pre;">桌面知识协作终端</div><div data-layer="S01-takeaway" class="layer" style="left:100px;top:516px;width:510px;height:35px;font-family:&quot;Microsoft YaHei UI&quot;,sans-serif;font-size:36px;font-weight:400;color:#C7DCF4;text-align:left;line-height:1.1;letter-spacing:0px;white-space:pre;">让每次讨论，都接得上下一步。</div><div data-layer="S01-features" class="layer" style="left:103px;top:615px;width:551px;height:21px;font-family:&quot;Microsoft YaHei UI&quot;,sans-serif;font-size:25px;font-weight:400;color:#DDE2ED;text-align:left;line-height:1 <script>const rows=[{"id": "S01-background", "role": "background"}, {"id": "S01-floor-reflection", "role": "decoration"}, {"id": "S01-contact-shadow", "role": "decoration"}, {"id": "S01-device-terminal", "role": "illustration"}, {"id": "S01-wordmark", "role": "special-typography"}, {"id": "S01-descriptor", "role": "text"}, {"id": "S01-takeaway", "role": "text"}, {"id": "S01-features", "role": "text"}, {"id": "S01-example", "role": "text"}],surface=document.querySelector('#surface'),wrap=document.querySelector('#wrap');function scale(n){surface.style.transform='scale('+n+')';wrap.style.width=(1672*n)+'px';wrap.style.height=(941*n)+'px'}function fit(){scale(Math.min(1,(innerWidth-20)/1672))}fit();document.querySelector('#fit').onclick=fit;document.querySelector('#actual').onclick=()=>scale(1);const controls=document.querySelector('#layers');for(const row of rows){const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.checked=true;box.dataset.target=row.id;box.onchange=()=>document.querySelector('[data-layer="'+row.id+'"]').hidden=!box.checked;label.append(box,document.createTextNode(row.id+' · '+row.role));controls.append(label)}function showAll(v){for(const box of controls.querySelectorAll('input')){box.checked=v;box.onchange()}document.querySelector('#onion').value=0;document.querySelector('#source').style.opacity=0}document.querySelector('#all').onclick=()=>showAll(true);document.querySelector('#none').onclick=()=>showAll(false);document.querySelector('#onion').oninput=e=>document.querySelector('#source').style.opacity=e.target.value/100;window.apwRender={scale,showAll,rows};</script></html>
