<script>const rows=[{"id": "S03-background", "role": "background"}, {"id": "S03-membrane", "role": "illustration"}, {"id": "S03-title", "role": "text"}, {"id": "S03-chart-heading", "role": "text"}, {"id": "S03-chart", "role": "chart"}, {"id": "S03-divider", "role": "decoration"}, {"id": "S03-bullet-1", "role": "decoration"}, {"id": "S03-bullet-2", "role": "decoration"}, {"id": "S03-single", "role": "text"}, {"id": "S03-takeaway", "role": "text"}, {"id": "S03-qualifier-frame", "role": "decoration"}, {"id": "S03-qualifier", "role": "text"}],surface=document.querySelector('#surface'),wrap=document.querySelector('#wrap');function scale(n){surface.style.transform='scale('+n+')';wrap.style.width=(1672*n)+'px';wrap.style.height=(941*n)+'px'}function fit(){scale(Math.min(1,(innerWidth-20)/1672))}fit();document.querySelector('#fit').onclick=fit;document.querySelector('#actual').onclick=()=>scale(1);const controls=document.querySelector('#layers');for(const row of rows){const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.checked=true;box.dataset.target=row.id;box.onchange=()=>document.querySelector('[data-layer="'+row.id+'"]').hidden=!box.checked;label.append(box,document.createTextNode(row.id+' · '+row.role));controls.append(label)}function showAll(v){for(const box of controls.querySelectorAll('input')){box.checked=v;box.onchange()}document.querySelector('#onion').value=0;document.querySelector('#source').style.opacity=0}document.querySelector('#all').onclick=()=>showAll(true);document.querySelector('#none').onclick=()=>showAll(false);document.querySelector('#onion').oninput=e=>document.querySelector('#source').style.opacity=e.target.value/100;window.apwRender={scale,showAll,rows};</script></html>
