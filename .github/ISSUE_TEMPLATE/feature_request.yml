name: Feature request
description: Propose a change or a new capability
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
